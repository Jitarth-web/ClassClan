{% extends "base.html" %}

{% block inner_content %}
<div class="container h-100">
    <div class="row h-100 align-items-center justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header py-2">
                    <h4 class="mb-0">Upload Assignment</h4>
                </div>
                <div class="card-body py-3">
                    <form action="{{ url_for('new_note') }}" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label mb-1">Assignment Title*</label>
                            <input type="text" class="form-control form-control-sm" id="title" name="title" required>
                            <div class="form-text small">Example: "Data Structures Assignment 1" or "Operating Systems Project"</div>
                        </div>

                        <div class="mb-3">
                            <label for="file" class="form-label mb-1">Upload File</label>
                            <input type="file" class="form-control form-control-sm" id="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx">
                            <div class="form-text small">Supported formats: PDF, Word Documents (.doc, .docx), PowerPoint (.ppt, .pptx)</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('notes_dashboard') }}" class="btn btn-sm btn-outline-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Back
                            </a>
                            <button type="submit" class="btn btn-sm btn-primary">
                                <i class="fas fa-upload me-1"></i> Upload Assignment
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.container.h-100 {
    min-height: calc(100vh - 56px); /* Adjust based on your navbar height */
}
.form-control-sm {
    font-size: 0.9rem;
}
.card {
    max-height: 95vh;
}
.form-text.small {
    font-size: 0.75rem;
    margin-top: 0.1rem;
}
</style>
{% endblock %}
