{% extends "base.html" %}

{% block inner_content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Edit Assignment</h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('edit_note', note_id=note.id) }}" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="title" class="form-label">Assignment Title*</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ note.title }}" required>
                        </div>

                        <div class="mb-4">
                            <label for="file" class="form-label">Upload File</label>
                            {% if note.file_name %}
                            <div class="mb-2">
                                <p class="mb-2"><strong>Current File:</strong></p>
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-file-{{ 'pdf' if note.file_type == 'pdf' else 'word' if note.file_type in ['doc', 'docx'] else 'powerpoint' if note.file_type in ['ppt', 'pptx'] else 'alt' }} fa-2x me-2"></i>
                                    <div>
                                        <p class="mb-0">{{ note.file_name }}</p>
                                        <small class="text-muted">{{ note.file_type.upper() }}</small>
                                    </div>
                                </div>
                                <a href="{{ url_for('download_note_file', note_id=note.id) }}" class="btn btn-sm btn-outline-primary mt-2">
                                    <i class="fas fa-download me-1"></i> Download Current File
                                </a>
                            </div>
                            {% endif %}
                            <input type="file" class="form-control mt-2" id="file" name="file" accept=".pdf,.doc,.docx,.ppt,.pptx">
                            <div class="form-text">Upload a new file to replace the current one. Leave empty to keep the current file.</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('notes_dashboard') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-1"></i> Back
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
